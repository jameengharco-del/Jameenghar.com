name: JameenGhar CRM and Daybnb regression checks

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-r2-safety
    paths:
      - "PROJECT-TRACKER.md"
      - "crm.html"
      - "admin.html"
      - "daybnb.html"
      - "daybnb-admin.html"
      - "daybnb-payment.html"
      - "property-owner.html"
      - "property-review.js"
      - "firestore/**"
      - "cloudflare/r2-guard/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - cloudflare-r2-safety
    paths:
      - "property-review.js"
      - "crm.html"
      - "admin.html"
      - "daybnb.html"
      - "daybnb-admin.html"
      - "daybnb-payment.html"
      - "property-owner.html"
      - "firestore/**"
      - "cloudflare/r2-guard/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run secure Worker, payment and email unit tests
        working-directory: cloudflare/r2-guard
        run: npm test
      - name: Exercise D1 migration with local SQLite compatibility checks
        run: python cloudflare/r2-guard/test/migration.test.py
      - name: Run local Firebase Firestore Rules Emulator security tests
        working-directory: firestore/emulator
        run: |
          cp ../firestore.rules.proposed rules.firestore
          npm install --no-audit --no-fund
          npm test
      - name: Syntax-check browser JavaScript modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          files = ["crm.html", "admin.html", "daybnb.html", "daybnb-admin.html", "daybnb-payment.html", "property-owner.html"]
          standalone = ["property-review.js"]
          for filename in standalone:
              subprocess.run(["node", "--check", filename], check=True)
              print(f"Syntax OK: {filename}")
          for filename in files:
              html = Path(filename).read_text()
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.I | re.S)
              if not scripts:
                  raise SystemExit(f"No script tags found in {filename}; refusing a vacuous syntax pass")
              for index, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  path = Path("/tmp") / f"{Path(filename).stem}-{index}.mjs"
                  path.write_text(script)
                  subprocess.run(["node", "--check", str(path)], check=True)
                  print(f"Syntax OK: {filename} script {index + 1}")
          PY
