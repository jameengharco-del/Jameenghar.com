name: JameenGhar CRM and Daybnb regression checks

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-r2-safety
    paths:
      - "crm.html"
      - "admin.html"
      - "daybnb.html"
      - "daybnb-admin.html"
      - "daybnb-payment.html"
      - "firestore/**"
      - "cloudflare/r2-guard/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - cloudflare-r2-safety
    paths:
      - "crm.html"
      - "admin.html"
      - "daybnb.html"
      - "daybnb-admin.html"
      - "daybnb-payment.html"
      - "firestore/**"
      - "cloudflare/r2-guard/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run secure Worker and payment unit tests
        working-directory: cloudflare/r2-guard
        run: npm test
      - name: Syntax-check browser JavaScript modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          files = ["crm.html", "admin.html", "daybnb.html", "daybnb-admin.html", "daybnb-payment.html"]
          for filename in files:
              html = Path(filename).read_text()
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.I | re.S)
              if not scripts:
                  raise SystemExit(f'No script tags found in {filename}; refusing a vacuous syntax pass')
              for index, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  path = Path("/tmp") / f"{Path(filename).stem}-{index}.mjs"
                  path.write_text(script)
                  subprocess.run(["node", "--check", str(path)], check=True)
                  print(f"Syntax OK: {filename} script {index + 1}")
          PY
